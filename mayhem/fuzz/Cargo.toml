# Standalone workspace so cargo doesn't try to fold this additive crate into the
# tokio-imap workspace (repo root Cargo.toml lists only imap-proto + tokio-imap).
[workspace]
members = ["."]

[package]
name = "tokio-imap-mayhem-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.imap-proto]
# Additive integration crate: depend on the upstream library by path (repo root is
# two levels up from mayhem/fuzz/). Leaves upstream Cargo.toml / sources untouched.
path = "../../imap-proto"

# Ports upstream's own harness imap-proto/fuzz/fuzz_targets/utf8_parse_response.rs
# (that crate pins libfuzzer-sys to an unpinned git ref, which isn't cacheable for the
# air-gapped re-run; this crate uses crates.io libfuzzer-sys 0.4 — same code path).
[[bin]]
name = "utf8_parse_response"
path = "fuzz_targets/utf8_parse_response.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
